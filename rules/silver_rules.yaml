needs_human:
- issue_ids:
  - ORDER:created_at>resolved_at
  question: 34.7% of tickets (1683 of 4853) have resolved_at before created_at, by 94–424 days, and the share is
    the same for unambiguous dates, so it is not a day/month mix-up. How should these rows be handled?
  options:
  - flag only (keep both dates)
  - null resolved_at for violating rows
  - reject violating rows
  - 'investigate source: columns may be swapped or mislabeled'
  agent_recommendation: Flag for now and investigate the source system. A share this large points to a systematic
    export problem, not random typos, and rejecting would lose a third of resolved tickets.
- issue_ids:
  - DATEFMT:created_at
  - DATEFMT:resolved_at
  question: The profiler found 8 date formats, but only 7 could be matched to registry ids. In a test, about 4.5%
    of created_at values still failed to parse and would become NULL (possibly epoch numbers). Which registry format
    should cover them?
  options:
  - provide the missing format id
  - accept NULL for these values
  agent_recommendation: Provide the missing format id. Losing 4.5% of creation timestamps biases ticket volume over
    time and time to resolve.
- issue_ids:
  - SENTINEL:sla_hours
  question: sla_hours = 0 appears in about 4.5% of sampled rows. Is 0 a real SLA target (e.g. immediate response)
    or a placeholder for 'no SLA set'?
  options:
  - keep 0 as a real value
  - treat 0 as NULL (sentinel)
  agent_recommendation: Treat 0 as a sentinel. A 0-hour SLA cannot be met, so it would push SLA compliance down
    artificially. Kept for now until confirmed.
- issue_ids:
  - MIXED:cost
  question: cost = 0 appears in about 3.1% of sampled rows. Is it a real zero-cost repair (internal staff) or a
    placeholder for unknown cost?
  options:
  - keep 0 as real cost
  - treat 0 as NULL
  agent_recommendation: Keep 0. Internal fixes at no vendor cost are plausible; confirm with operations.
- issue_ids:
  - VARIANTS:category
  question: 'Should subcategory and synonym labels be merged into parent categories: Sprinkler/Fire Alarm into fire_safety,
    Access Control/Badge-Access into security, Vertical Transport into elevator, Exterminator into pest_control,
    Housekeeping/cleaning into janitorial, water issue into plumbing?'
  options:
  - merge as proposed
  - keep subcategories separate
  agent_recommendation: Merge as proposed so category-level volume and cost add up. Revisit if the business reports
    on subcategories.

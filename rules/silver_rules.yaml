  - DD-Mon-YYYY
  - Mon DD, YYYY
  - epoch seconds
  day_month_order: mdy
  confidence: 0.8
  why: 'created_at comes in 8 formats. 1,863 values only make sense as month-first and none as day-first, so the
    1,234 ambiguous slash dates are read as mdy. Tested: only 0.05% of rows stay unparseable. ''tbd'' and ''0000-00-00''
    become NULL so they don''t skew time-to-resolution.'
  addresses:
  - DATEFMT:created_at
  - AMBIG:created_at
  - NULLTOK:created_at
  - SENTINEL:created_at
  - UNPARSED:created_at
  generated_by: agent
- name: resolved_at

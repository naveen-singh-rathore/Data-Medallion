needs_human:
- issue_ids:
  - ORDER:created_at>resolved_at
  question: 35% of resolved tickets (1,866) appear to be resolved before they were created. Are created_at and resolved_at
    swapped at the source, or are these data-entry errors?
  options:
  - Flag only and keep both timestamps
  - Null resolved_at when it is before created_at
  - Swap the two timestamps
  - Reject the rows
  agent_recommendation: Flag only for now. The share is too large to discard, and swapping without confirmation
    would invent resolution times.
- issue_ids:
  - MIXED:cost
  question: Does a cost of 0 mean a real zero-cost job (for example, done by an internal crew) or an unknown cost?
  options:
  - Keep 0 as a real cost
  - Treat 0 as unknown (NULL)
  agent_recommendation: Keep 0 for now. Internal-crew jobs can plausibly cost nothing.
- issue_ids:
  - AMBIG:created_at
  - AMBIG:resolved_at
  question: Slash dates are read as month-first (US). 1,863 and 956 values only make sense that way and none as
    day-first. Is US order correct for every source system?
  options:
  - mdy (US)
  - dmy
  agent_recommendation: mdy

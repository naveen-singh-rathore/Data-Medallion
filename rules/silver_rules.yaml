  generated_by: agent
dedup:
  key:
  - ticket_id
  strategy: keep_latest
  order_by: resolved_at
  why: 10,258 distinct ids for about 10,260 non-null ids means a few tickets repeat. Keeping the latest version
    stops resolved tickets from also being counted in the backlog.
row_checks:
- kind: swapped_columns
  params:
    a: category
    b: description
  action: swap
  why: At least one category holds description text ('Elevator A-001 stuck be…'). Swapping those values back restores
    the correct category so ticket volume by category is right.
- kind: date_order
  params:
    a: created_at
    b: resolved_at
  action: flag
  why: 1,866 of 5,319 resolved tickets (35%) appear to be resolved before they were created, which would give negative
    resolution times. These rows are flagged, not deleted, until a person confirms whether the timestamps are swapped.
  addresses:
  - ORDER:created_at>resolved_at
- kind: junk_row
  params:
    id: ticket_id
    id_pattern: ^[A-Za-z0-9_-]+$
    min_empty_share: '0.5'
  action: flag
  why: 28 rows have 7 or more of 13 cells empty. They are flagged rather than rejected so that tickets with a valid
    id still count in volume while their missing fields are reviewed.
  addresses:
  - PARTIAL_ROWS:dataset
- kind: declared_duplicate
  params:
    id: ticket_id
    pattern: '(?i)duplicate of ticket #?([0-9]+)'
    prefix: TKT-
    source: resolution_notes
  action: duplicate
  why: '823 tickets are closed as ''Duplicate of ticket #N''; counting them as new work double-counts volume, backlog
    and cost.'

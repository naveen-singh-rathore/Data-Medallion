target-version = "py312"
src = ["backend"]
line-length = 120

[format]
# `ruff format` owns layout. A few dense tables/SQL builders opt out with `# fmt: skip`.
docstring-code-format = true

[lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                # import order
    "B",                # bugbear: likely bugs
    "UP",               # modern Python syntax
    "SIM", "PIE", "RET", "PERF",
    "RUF",
    "BLE",              # blind `except Exception` must be deliberate (noqa with a reason)
    "DTZ",              # timezone-aware datetimes
    "S",                # bandit security checks
    "TRY",              # exception handling hygiene
    "LOG", "G",         # logging calls
    "ARG",              # unused arguments
    "C90",              # cyclomatic complexity
    "PLE", "PLW", "PLR0911", "PLR0912", "PLR0915",
    "ANN0", "ANN2",     # type hints on every function
    "D1",               # docstrings on public modules, classes and functions
]
ignore = [
    "E501",     # line length is the formatter's job
    "TRY003",   # messages are written at the raise site on purpose (they reach the UI)
    "TRY301",   # builds raise reconciliation errors inside their transaction so the failure path records them
    "S311",     # `random` is only used for seeded, reproducible sampling; nothing security-related
    "RUF001", "RUF003",  # `×` and `–` are intentional in text shown to people and to the model
    "D105",     # magic methods
    "D107",     # __init__ (documented on the class)
]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-returns = 8
max-branches = 14

[lint.per-file-ignores]
# Pydantic copies a class docstring into the JSON schema sent to the model (tool inputs, SilverRules):
# a docstring there changes the prompt and invalidates recorded answers. Guarded by tests/test_llm_contract.py.
"backend/pipeline/agent_tools/tools.py" = ["D101"]
"backend/pipeline/silver/rules_schema.py" = ["D101"]
# Source timestamps carry no zone: profiling and date parsing compare wall-clock values on purpose.
"backend/pipeline/profile_dates.py" = ["DTZ001", "DTZ007"]
"backend/tests/**" = ["S101", "S105", "S608", "D1", "ANN", "ARG", "PLR", "C90", "DTZ001", "DTZ007"]

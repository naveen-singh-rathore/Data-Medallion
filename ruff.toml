target-version = "py312"
src = ["backend"]
line-length = 120

[format]
# `ruff format` owns layout. A few dense tables/SQL builders opt out with `# fmt: skip`.
docstring-code-format = true

[lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                # import order
    "B",                # bugbear: likely bugs
    "UP",               # modern Python syntax
    "SIM", "PIE", "RET", "PERF",
    "RUF",
    "BLE",              # blind `except Exception` must be deliberate (noqa with a reason)
    "DTZ",              # timezone-aware datetimes
    "S",                # bandit security checks
    "TRY",              # exception handling hygiene
    "LOG", "G",         # logging calls
    "ARG",              # unused arguments
    "C90",              # cyclomatic complexity
    "PLE", "PLW", "PLR0911", "PLR0912", "PLR0915",
    "ANN0", "ANN2",     # type hints on every function
    "D1",               # docstrings on public modules, classes and functions
]
ignore = [
    "E501",     # line length is the formatter's job
    "TRY003",   # messages are written at the raise site on purpose (they reach the UI)
    "D105",     # magic methods
    "D107",     # __init__ (documented on the class)
]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-returns = 8
max-branches = 14

[lint.per-file-ignores]
"backend/tests/**" = ["S101", "S608", "S311", "D1", "ANN", "ARG", "PLR", "C90"]
